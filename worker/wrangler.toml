name = "painter-ghosts"
main = "index.js"
compatibility_date = "2024-09-23"

# Locks CORS to your deployed frontend. Update for your actual domain(s)
# (add a second [vars] entry or a small allowlist array if you need more than one).
[vars]
ALLOWED_ORIGIN = "https://painter.vercel.app"

# Fill in `database_id` after running:
#   wrangler d1 create painter-ghosts
[[d1_databases]]
binding = "DB"
database_name = "painter-ghosts"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Fill in `id` after running:
#   wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
