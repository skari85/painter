name = "painter-ghosts"
main = "index.js"
compatibility_date = "2024-09-23"

# Comma-separated exact origins. Localhost is included for local browser testing.
[vars]
ALLOWED_ORIGINS = "https://painter-iota.vercel.app,http://localhost:4173"

# Fill in `database_id` after running:
#   wrangler d1 create painter-ghosts
[[d1_databases]]
binding = "DB"
database_name = "painter-ghosts"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Fill in `id` after running:
#   wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
